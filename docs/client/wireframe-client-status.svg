<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #9ca3af; stroke-width: 1; }
    .panel { fill: #f9fafb; stroke: #d1d5db; }
    .input { fill: #ffffff; stroke: #9ca3af; }
    .input-dis { fill: #f3f4f6; stroke: #d1d5db; }
    .lbl { font-size: 12px; fill: #374151; }
    .val { font-size: 12px; fill: #6b7280; }
    .ph { font-size: 12px; fill: #9ca3af; }
    .h { font-size: 15px; font-weight: bold; fill: #15803d; }
    .bold { font-weight: bold; }
    .line { stroke: #e5e7eb; }
    .c circle { fill: #dc2626; }
    .c text { font-size: 11px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>

  <rect class="bg" width="1200" height="830"/>

  <!-- ===================== CLIENT LOOKUP + DETAILS ===================== -->
  <rect class="frame" x="10" y="10" width="1180" height="290" rx="6"/>

  <!-- Left: Lookup Client -->
  <text class="h" x="30" y="45">Lookup Client</text>

  <text class="lbl" x="30" y="83">First Name</text>
  <rect class="input" x="110" y="62" width="300" height="32" rx="4"/>
  <text class="ph" x="120" y="83">Search First Name</text><text class="ph" x="392" y="83">▾</text>
  <rect class="input" x="420" y="62" width="36" height="32" rx="4"/><text class="lbl" x="432" y="83">→</text>

  <text class="lbl" x="30" y="127">Last Name</text>
  <rect class="input" x="110" y="106" width="300" height="32" rx="4"/>
  <text class="ph" x="120" y="127">Search Last Name</text><text class="ph" x="392" y="127">▾</text>
  <rect class="input" x="420" y="106" width="36" height="32" rx="4"/><text class="lbl" x="432" y="127">→</text>

  <text class="lbl" x="30" y="171">DOB</text>
  <rect class="input" x="110" y="150" width="300" height="32" rx="4"/>
  <text class="val" x="120" y="171">04/12/2024</text><text class="val" x="390" y="171">×</text>
  <rect class="input-dis" x="420" y="150" width="36" height="32" rx="4"/><text class="ph" x="432" y="171">→</text>

  <text class="lbl" x="30" y="215">SSN</text>
  <rect class="input" x="110" y="194" width="300" height="32" rx="4"/>
  <text class="ph" x="120" y="215">Search SSN</text><text class="ph" x="392" y="215">▾</text>
  <rect class="input" x="420" y="194" width="36" height="32" rx="4"/><text class="lbl" x="432" y="215">→</text>

  <!-- Divider -->
  <line x1="500" y1="25" x2="500" y2="285" stroke="#d1d5db"/>

  <!-- Right: Client details -->
  <text class="lbl bold" x="520" y="45">Client ID</text>
  <text x="590" y="48" font-size="22" font-weight="bold" fill="#15803d">1042</text>

  <text class="lbl" x="520" y="83">Last Name</text>
  <rect class="input-dis" x="610" y="62" width="240" height="32" rx="4"/><text class="val" x="620" y="83">Smith</text>
  <text class="lbl" x="870" y="83">Gender</text>
  <rect class="input-dis" x="930" y="62" width="110" height="32" rx="4"/><text class="val" x="940" y="83">Female</text><text class="ph" x="1022" y="83">▾</text>

  <text class="lbl" x="520" y="127">First Name</text>
  <rect class="input-dis" x="610" y="106" width="240" height="32" rx="4"/><text class="val" x="620" y="127">Anna</text>

  <text class="lbl" x="520" y="171">SS#</text>
  <rect class="input-dis" x="610" y="150" width="240" height="32" rx="4"/><text class="val" x="620" y="171">123456789</text>

  <text class="lbl" x="520" y="215">Region</text>
  <rect class="input-dis" x="610" y="194" width="240" height="32" rx="4"/><text class="val" x="620" y="215">Burlington</text><text class="ph" x="832" y="215">▾</text>

  <text class="lbl" x="520" y="259">Birth Date</text>
  <rect class="input-dis" x="610" y="238" width="240" height="32" rx="4"/><text class="val" x="620" y="259">04/12/2024</text>
  <text class="lbl" x="870" y="259">Age:</text><text x="900" y="259" font-size="12" font-weight="bold" fill="#15803d">2</text>
  <rect class="input-dis" x="960" y="246" width="16" height="16" rx="3"/><text class="lbl" x="982" y="259">Non-EI</text>

  <!-- ===================== ACTION BAR ===================== -->
  <rect x="20" y="318" width="282" height="36" rx="6" fill="#15803d"/>
  <text x="161" y="341" font-size="13" fill="#ffffff" text-anchor="middle">Unlock</text>
  <rect x="312" y="318" width="282" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="453" y="341" font-size="13" fill="#9ca3af" text-anchor="middle">Delete Client</text>
  <rect x="604" y="318" width="282" height="36" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="745" y="341" font-size="13" fill="#2563eb" text-anchor="middle">Add New Client</text>
  <rect x="896" y="318" width="282" height="36" rx="6" fill="#d1d5db"/>
  <text x="1037" y="341" font-size="13" fill="#6b7280" text-anchor="middle">Done</text>

  <!-- ===================== TABS ===================== -->
  <rect class="frame" x="10" y="372" width="1180" height="448" rx="6"/>
  <rect x="10" y="372" width="1180" height="40" fill="#f9fafb"/>
  <rect x="10" y="372" width="160" height="40" fill="#ffffff"/>
  <line x1="10" y1="411" x2="170" y2="411" stroke="#15803d" stroke-width="2"/>
  <text x="90" y="397" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Client Status</text>
  <text x="245" y="397" font-size="13" fill="#4b5563" text-anchor="middle">Input Forms</text>

  <!-- Status header -->
  <rect x="10" y="412" width="1180" height="46" fill="#f9fafb"/>
  <line x1="10" y1="458" x2="1190" y2="458" class="line"/>
  <text class="lbl" x="25" y="440">Client Status On</text>
  <rect class="input" x="130" y="420" width="150" height="30" rx="4"/><text class="val" x="140" y="440">08/26/2026</text>
  <rect x="290" y="420" width="60" height="30" rx="4" fill="#ffffff" stroke="#2563eb"/><text x="320" y="440" font-size="12" fill="#2563eb" text-anchor="middle">Go</text>
  <rect x="360" y="420" width="70" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/><text x="395" y="440" font-size="12" fill="#374151" text-anchor="middle">Today</text>

  <!-- Status details -->
  <text class="lbl bold" x="30" y="490">Status</text><text x="170" y="490" font-size="12" font-weight="bold" fill="#15803d">Active</text>
  <line x1="25" y1="500" x2="300" y2="500" class="line"/>
  <text class="lbl bold" x="30" y="520">Referral Date</text><text class="val" x="170" y="520">2/3/2025</text>
  <line x1="25" y1="530" x2="300" y2="530" class="line"/>
  <text class="lbl bold" x="30" y="550">No One Plan Date</text><text class="val" x="170" y="550">—</text>
  <line x1="25" y1="560" x2="300" y2="560" class="line"/>
  <text class="lbl bold" x="30" y="580">Interim Date</text><text class="val" x="170" y="580">2/20/2025</text>
  <line x1="25" y1="590" x2="300" y2="590" class="line"/>
  <text class="lbl bold" x="30" y="610">One Plan Date</text><text class="val" x="170" y="610">3/10/2025</text>
  <line x1="25" y1="620" x2="300" y2="620" class="line"/>
  <text class="lbl bold" x="30" y="640">Exit Date</text><text class="val" x="170" y="640">—</text>

  <rect x="25" y="670" width="275" height="56" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="35" y="692" font-size="11" fill="#1d4ed8">To view client status for an earlier date,</text>
  <text x="35" y="710" font-size="11" fill="#1d4ed8">change Client Status On and click Go.</text>

  <line x1="310" y1="470" x2="310" y2="810" stroke="#e5e7eb"/>

  <!-- Notes -->
  <text class="lbl bold" x="320" y="485">Notes</text>
  <rect class="input" x="320" y="495" width="275" height="310" rx="4"/>
  <text class="ph" x="330" y="515">Enter notes here...</text>

  <!-- Service History -->
  <rect class="input" x="610" y="470" width="570" height="335" rx="6" stroke="#d1d5db"/>
  <rect x="611" y="471" width="568" height="34" fill="#f9fafb"/>
  <text x="625" y="493" font-size="14" font-weight="bold" fill="#15803d">Service History</text>
  <text x="940" y="493" font-size="12" fill="#2563eb">Freq.</text>
  <text x="995" y="493" font-size="12" fill="#2563eb">Consent</text>
  <text x="1070" y="493" font-size="12" fill="#2563eb">Case Plan</text>
  <rect x="611" y="505" width="568" height="30" fill="#f3f4f6"/>
  <text class="lbl bold" x="625" y="525">Date</text>
  <text class="lbl bold" x="720" y="525">Service</text>
  <text class="lbl bold" x="880" y="525">Freq.</text>
  <text class="lbl bold" x="970" y="525">Consent</text>
  <text class="lbl bold" x="1070" y="525">Case Plan</text>
  <text class="val" x="625" y="555">3/10/2025</text><text class="val" x="720" y="555">Speech Therapy</text><text class="val" x="880" y="555">1x/week</text>
  <rect x="966" y="542" width="40" height="20" rx="10" fill="#dcfce7"/><text x="986" y="556" font-size="11" fill="#15803d" text-anchor="middle">Yes</text>
  <line x1="611" y1="565" x2="1179" y2="565" class="line"/>
  <text class="val" x="625" y="585">3/10/2025</text><text class="val" x="720" y="585">Service Coordination</text><text class="val" x="880" y="585">2x/month</text>
  <rect x="966" y="572" width="62" height="20" rx="10" fill="#fef9c3"/><text x="997" y="586" font-size="11" fill="#a16207" text-anchor="middle">Pending</text>
  <line x1="611" y1="595" x2="1179" y2="595" class="line"/>

  <!-- ===================== CALLOUTS ===================== -->
  <g class="c"><circle cx="476" cy="78" r="11"/><text x="476" y="82">1</text></g>
  <g class="c"><circle cx="476" cy="122" r="11"/><text x="476" y="126">2</text></g>
  <g class="c"><circle cx="476" cy="166" r="11"/><text x="476" y="170">3</text></g>
  <g class="c"><circle cx="476" cy="210" r="11"/><text x="476" y="214">4</text></g>
  <g class="c"><circle cx="438" cy="45" r="11"/><text x="438" y="49">5</text></g>
  <g class="c"><circle cx="660" cy="40" r="11"/><text x="660" y="44">6</text></g>
  <g class="c"><circle cx="597" cy="78" r="11"/><text x="597" y="82">7</text></g>
  <g class="c"><circle cx="597" cy="122" r="11"/><text x="597" y="126">8</text></g>
  <g class="c"><circle cx="1056" cy="78" r="11"/><text x="1056" y="82">9</text></g>
  <g class="c"><circle cx="597" cy="166" r="11"/><text x="597" y="170">10</text></g>
  <g class="c"><circle cx="597" cy="210" r="11"/><text x="597" y="214">11</text></g>
  <g class="c"><circle cx="597" cy="254" r="11"/><text x="597" y="258">12</text></g>
  <g class="c"><circle cx="934" cy="254" r="11"/><text x="934" y="258">13</text></g>
  <g class="c"><circle cx="1045" cy="254" r="11"/><text x="1045" y="258">14</text></g>
  <g class="c"><circle cx="282" cy="336" r="11"/><text x="282" y="340">15</text></g>
  <g class="c"><circle cx="574" cy="336" r="11"/><text x="574" y="340">16</text></g>
  <g class="c"><circle cx="866" cy="336" r="11"/><text x="866" y="340">17</text></g>
  <g class="c"><circle cx="1158" cy="336" r="11"/><text x="1158" y="340">18</text></g>
  <g class="c"><circle cx="335" cy="392" r="11"/><text x="335" y="396">19</text></g>
  <g class="c"><circle cx="280" cy="420" r="11"/><text x="280" y="424">20</text></g>
  <g class="c"><circle cx="350" cy="420" r="11"/><text x="350" y="424">21</text></g>
  <g class="c"><circle cx="430" cy="420" r="11"/><text x="430" y="424">22</text></g>
  <g class="c"><circle cx="290" cy="486" r="11"/><text x="290" y="490">23</text></g>
  <g class="c"><circle cx="290" cy="576" r="11"/><text x="290" y="580">24</text></g>
  <g class="c"><circle cx="300" cy="670" r="11"/><text x="300" y="674">25</text></g>
  <g class="c"><circle cx="595" cy="495" r="11"/><text x="595" y="499">26</text></g>
  <g class="c"><circle cx="1180" cy="470" r="11"/><text x="1180" y="474">27</text></g>
</svg>
